<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Dashboard | PASPA GO
  </title>


  <!-- CSS UTAMA -->
  <link
    rel="stylesheet"
    href="../css/style.css"
  >


  <!-- CSS DASHBOARD -->
  <link
    rel="stylesheet"
    href="../css/dashboard.css"
  >

</head>


<body class="dashboard-body">

<!-- =====================================================
     WELCOME SPLASH SCREEN
===================================================== -->

<div
  id="welcomeSplash"
  class="welcome-splash"
>

  <img
    src="../images/welcome.jpg"
    alt="Welcome PASPA GO"
    class="welcome-splash-image"
  >

  <button
    type="button"
    id="closeWelcomeSplash"
    class="welcome-splash-close"
    aria-label="Tutup"
    title="Tutup"
  >
    ✕
  </button>

  <div class="welcome-splash-overlay"></div>

</div>


  <main class="dashboard-shell">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="dashboard-header">


      <img
        src="../images/logo paspa go.png"
        alt="Logo PASPA GO"
        class="dashboard-logo"
      >


      <button
        type="button"
        id="logoutButton"
        class="logout-button"
        title="Log Keluar"
        aria-label="Log Keluar"
      >
        ↪
      </button>


    </header>



    <!-- =====================================================
         KAD AHLI
    ====================================================== -->

    <section class="member-card">


      <div class="photo-wrapper">

        <img
          id="memberPhoto"
          src="../images/default-avatar.png"
          alt="Gambar Ahli PASPA"
          class="member-photo"
        >

      </div>


      <div class="member-details">


        <p class="welcome-text">
          Selamat datang
        </p>


        <h1 id="memberName">
          Memuatkan...
        </h1>


        <div class="detail-row">

          <span>
            ID PASPA
          </span>

          <strong id="memberId">
            -
          </strong>

        </div>


        <div class="detail-row">

          <span>
            No. Kad Pengenalan
          </span>

          <strong id="memberIc">
            -
          </strong>

        </div>


      </div>


    </section>



    <!-- =====================================================
         MENU DASHBOARD
    ====================================================== -->

    <section class="dashboard-menu">


      <!-- DATA PERIBADI -->

      <button
        type="button"
        class="menu-card"
        onclick="window.location.href='profile.html'"
      >

        <span class="menu-icon">
          👤
        </span>

        <span>
          Data Peribadi
        </span>

      </button>



      <!-- PROGRAM -->

      <button
        type="button"
        class="menu-card"
        onclick="window.location.href='program.html'"
      >

        <span class="menu-icon">
          📚
        </span>

        <span>
          Program
        </span>

      </button>



      <!-- OPERASI -->

      <button
        type="button"
        class="menu-card"
        id="operationButton"
      >

        <span class="menu-icon">
          🎖️
        </span>

        <span>
          Operasi
        </span>

      </button>



      <!-- INVENTORI -->

      <button
        type="button"
        class="menu-card"
        id="inventoryButton"
      >

        <span class="menu-icon">
          🎒
        </span>

        <span>
          Inventori
        </span>

      </button>



      <!-- DIARI PASPA -->

      <button
        type="button"
        class="menu-card"
        id="diaryButton"
      >

        <span class="menu-icon">
          📝
        </span>

        <span>
          Diari PASPA
        </span>

      </button>



      <!-- HEBAHAN -->

      <button
        type="button"
        class="menu-card"
        id="announcementButton"
      >

        <span class="menu-icon">
          📢
        </span>

        <span>
          Hebahan
        </span>

      </button>



      <!-- DIREKTORI -->

      <button
        type="button"
        class="menu-card"
        id="directoryButton"
      >

        <span class="menu-icon">
          📇
        </span>

        <span>
          Direktori
        </span>

      </button>



      <!-- PENGURUSAN & LAPORAN -->

      <button
        type="button"
        id="managementReportButton"
        class="menu-card"
      >

        <span class="menu-icon">
          📊
        </span>

        <span>
          Pengurusan & Laporan
        </span>

      </button>


    </section>



    <!-- =====================================================
         MESEJ SISTEM
    ====================================================== -->

    <div
      id="dashboardMessage"
      class="message hidden"
      role="alert"
    ></div>


  </main>



  <!-- =====================================================
       BOTTOM NAVIGATION
  ====================================================== -->

  <nav class="bottom-nav">


    <!-- PROFIL -->

    <button
      type="button"
      class="bottom-nav-item"
      onclick="window.location.href='profile.html'"
    >

      <span class="bottom-nav-icon">
        👤
      </span>

      <span class="bottom-nav-text">
        Profil
      </span>

    </button>



    <!-- ON SCENE -->

    <button
      type="button"
      class="bottom-nav-item"
      onclick="window.location.href='onScene.html'"
    >

      <span class="bottom-nav-icon">
        🚨
      </span>

      <span class="bottom-nav-text">
        On Scene
      </span>

    </button>



    <!-- LOGO PASPA -->

    <button
      type="button"
      class="bottom-nav-logo"
      id="bottomPaspaLogo"
      title="ID Kad Digital"
      onclick="window.location.href='idcard.html'"
    >

      <img
        src="../images/logo.png"
        alt="PASPA"
      >

    </button>



    <!-- MESEJ -->

    <a
      href="mesej.html"
      class="bottom-nav-item"
      id="messageNavButton"
    >

      <span class="message-icon-wrapper">

        <span class="bottom-nav-icon">
          ✉️
        </span>


        <span
          id="messageBadge"
          class="message-badge"
          hidden
        >
          0
        </span>

      </span>


      <span class="bottom-nav-text">
        Mesej
      </span>

    </a>



    <!-- TETAPAN -->

    <button
      type="button"
      class="bottom-nav-item"
      onclick="window.location.href='settings.html'"
    >

      <span class="bottom-nav-icon">
        ⚙️
      </span>

      <span class="bottom-nav-text">
        Tetapan
      </span>

    </button>


  </nav>



  <!-- =====================================================
       JAVASCRIPT
       PENTING:
       Letak selepas bottom navigation
  ====================================================== -->

  <script src="../js/config.js"></script>

  <script src="../js/api.js"></script>

  <script src="../js/dashboard.js"></script>


</body>

</html>
