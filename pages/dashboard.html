<style>
 
/* FLOATING PASPA AI */

#paspaAiFloat {
  position: fixed;
  right: 20px;
  bottom: 90px;
  width: 100px;
  height: 100px;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;
  border: none;
  border-radius: 0;
  overflow: visible;

  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;

  filter: drop-shadow(0 5px 8px rgba(0,0,0,.35));
}

#paspaAiFloat img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

#paspaAiFloat:active {
  cursor: grabbing;
}

/* PAPARAN MOBILE */

@media (max-width: 600px) {
  #paspaAiFloat {
    width: 85px;
    height: 85px;
    right: 15px;
    bottom: 85px;
  }
}

</style>



<script>
(function () {
  const button = document.getElementById("paspaAiFloat");
  if (!button) return;

  let startX = 0;
  let startY = 0;
  let originX = 0;
  let originY = 0;
  let dragging = false;
  let moved = false;
  let suppressClick = false;

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  button.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;

    const rect = button.getBoundingClientRect();

    startX = e.clientX;
    startY = e.clientY;
    originX = rect.left;
    originY = rect.top;
    dragging = true;
    moved = false;

    button.setPointerCapture(e.pointerId);
  });

  button.addEventListener("pointermove", function (e) {
    if (!dragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (Math.hypot(dx, dy) > 6) {
      moved = true;
    }

    if (!moved) return;

    const x = clamp(
      originX + dx,
      0,
      Math.max(0, window.innerWidth - button.offsetWidth)
    );

    const y = clamp(
      originY + dy,
      0,
      Math.max(0, window.innerHeight - button.offsetHeight)
    );

    button.style.left = x + "px";
    button.style.top = y + "px";
    button.style.right = "auto";
    button.style.bottom = "auto";
  });

  function finishDrag() {
    if (!dragging) return;

    dragging = false;

    if (moved) {
      suppressClick = true;
    }
  }

  button.addEventListener("pointerup", finishDrag);
  button.addEventListener("pointercancel", finishDrag);

  button.addEventListener("click", function (e) {
    if (suppressClick) {
      e.preventDefault();
      suppressClick = false;
    }
  });
})();
</script>
