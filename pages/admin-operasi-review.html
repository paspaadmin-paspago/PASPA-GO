<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Semakan Panggilan Operasi | PASPA GO
  </title>

  <link
    rel="stylesheet"
    href="../css/admin-operasi-review.css"
  >

</head>


<body>

  <div class="review-page">


    <!-- HEADER -->

    <header class="review-header">

      <button
        type="button"
        id="backButton"
        class="header-button"
      >
        ←
      </button>


      <div class="review-header-title">
        Semakan Panggilan Operasi
      </div>


      <button
        type="button"
        id="homeButton"
        class="header-button"
      >
        🏠
      </button>

    </header>


    <!-- ACTION -->

    <div class="review-actions no-print">

      <button
        type="button"
        id="printButton"
        class="action-button"
      >
        🖨️ Print
      </button>


      <button
        type="button"
        id="downloadButton"
        class="action-button"
      >
        ⬇ Download
      </button>


      <button
        type="button"
        id="confirmButton"
        class="confirm-button"
      >
        PASTI
      </button>

    </div>


    <!-- MESSAGE -->

    <div
      id="reviewMessage"
      class="review-message no-print"
      hidden
    ></div>


    <!-- LETTER -->

    <main>

      <div class="review-letter-container">

        <div
          id="reviewLetterScale"
          class="review-letter-scale"
        >

          <div
            id="operationLetter"
            class="letter-pages"
          ></div>

        </div>

      </div>

    </main>

  </div>


  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
  ></script>

  <script src="../js/config.js"></script>

  <script src="../js/api.js"></script>

  <script src="../js/admin-operasi-review.js"></script>

</body>

</html>
