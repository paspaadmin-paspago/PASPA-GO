
<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Diari PASPA | PASPA GO</title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../css/diari.css"
  >
</head>

<body class="diari-body">

  <main class="diari-shell">

    <!-- HEADER -->

    <nav class="paspa-top-nav">

      <button
        type="button"
        id="diariBack"
        class="paspa-nav-button"
        aria-label="Kembali"
      >←</button>

      <h1 class="paspa-nav-title">
        Diari PASPA
      </h1>

      <button
        type="button"
        id="diariHome"
        class="paspa-nav-button"
        aria-label="Dashboard"
      >🏠</button>

    </nav>


    <!-- LOGO -->

    <div class="diari-logo">

      <img
        src="../images/logo paspa go.png"
        alt="PASPA GO"
      >

    </div>


    <!-- BMI -->

    <section class="diari-card diari-bmi-card">

      <h2>Status BMI Terkini</h2>

      <div class="bmi-grid">

        <div class="bmi-box">

          <span>Berat</span>

          <strong id="bmiWeight">—</strong>

          <small>kg</small>

        </div>

        <div class="bmi-box">

          <span>Tinggi</span>

          <strong id="bmiHeight">—</strong>

          <small>cm</small>

        </div>

        <div class="bmi-box">

          <span>BMI</span>

          <strong id="bmiValue">—</strong>

          <small id="bmiStatus">
            Tiada rekod
          </small>

        </div>

      </div>

      <p
        id="bmiDate"
        class="bmi-date"
      >
        Tarikh rekod: —
      </p>

    </section>


    <!-- KALENDAR -->

    <section class="diari-card diari-calendar-card">

      <!-- BUTANG KALENDAR SEBARIS -->

<div class="diari-calendar-toolbar">

  <button
    type="button"
    id="diariToday"
    class="diari-today"
  >
    Hari Ini
  </button>

  <div class="diari-view-tabs">

    <button
      type="button"
      data-view="day"
    >
      Harian
    </button>

    <button
      type="button"
      data-view="week"
    >
      Mingguan
    </button>

    <button
      type="button"
      data-view="month"
      class="active"
    >
      Bulanan
    </button>

  </div>

</div>

      <!-- NAVIGASI TARIKH -->

      <div class="diari-calendar-nav">

        <button
          type="button"
          id="diariPrevious"
          aria-label="Sebelumnya"
        >
          ‹
        </button>

        <h3 id="diariPeriodTitle">
          Memuatkan...
        </h3>

        <button
          type="button"
          id="diariNext"
          aria-label="Seterusnya"
        >
          ›
        </button>

      </div>


      <!-- GRID KALENDAR -->

      <div id="diariCalendar"></div>

    </section>


    <!-- CATATAN TARIKH DIPILIH -->

    <section class="diari-card diari-entry-card">

      <div class="diari-entry-heading">

        <h2 id="diariSelectedTitle">
          Catatan Diari
        </h2>

      </div>

      <div id="diariEntryList">

        <p class="diari-empty">
          Tiada catatan.
        </p>

      </div>


      <!-- TAMBAH CATATAN -->

      <div class="diari-add-wrap">

        <button
          type="button"
          id="diariAddButton"
          class="diari-add-circle"
          aria-label="Tambah catatan diari"
          title="Tambah catatan diari"
        >
          +
        </button>

        <span class="diari-add-caption">
          Tambah Catatan
        </span>

      </div>

    </section>


    <!-- BORANG CATATAN -->

    <section
      id="diariFormSection"
      class="diari-card diari-form-card"
      hidden
    >

      <h2>Tambah Catatan Diari</h2>

      <form id="diariForm">

        <!-- TARIKH -->

        <div class="diari-date-range">

          <div class="diari-date-field">

            <label for="diariTarikh">
              Tarikh Mula
            </label>

            <input
              type="date"
              id="diariTarikh"
              required
            >

          </div>

          <div class="diari-date-field">

            <label for="diariTarikhTamat">
              Tarikh Tamat
            </label>

            <input
              type="date"
              id="diariTarikhTamat"
            >

          </div>

        </div>

        <p class="diari-date-hint"></p>


        <!-- PERKARA -->

        <label for="diariPerkara">
          Perkara
        </label>

        <input
          type="text"
          id="diariPerkara"
          maxlength="200"
          required
          placeholder="Masukkan perkara"
        >


        <!-- JENIS -->

        <label for="diariJenis">
          Jenis
        </label>

        <select
          id="diariJenis"
          required
        >

          <option value="">
            Pilih jenis
          </option>

          <option>Event</option>
          <option>Larian</option>
          <option>Renangan</option>
          <option>Hiking</option>
          <option>Fitness</option>
          <option>Pameran</option>
          <option>Demo</option>
          <option>Mesyuarat</option>

          <option value="Lain-lain">
            Lain-lain
          </option>

        </select>


        <!-- JENIS LAIN-LAIN -->

        <div
          id="diariOtherWrap"
          hidden
        >

          <label for="diariOther">
            Nyatakan Jenis
          </label>

          <input
            type="text"
            id="diariOther"
            maxlength="100"
            placeholder="Jenis aktiviti"
          >

        </div>


        <!-- MASA -->

        <label for="diariMasa">
          Masa
        </label>

        <input
          type="time"
          id="diariMasa"
          required
        >


        <!-- CATATAN -->

        <label for="diariCatatan">
          Catatan
        </label>

        <textarea
          id="diariCatatan"
          rows="4"
          maxlength="5000"
          placeholder="Masukkan catatan"
        ></textarea>


        <!-- TINDAKAN -->

        <div class="diari-form-actions">

          <button
            type="submit"
            id="diariSave"
            class="diari-save"
          >
            SIMPAN
          </button>

          <button
            type="button"
            id="diariCancel"
            class="diari-cancel"
          >
            BATAL
          </button>

        </div>

      </form>

    </section>


    <!-- MESEJ -->

    <div
      id="diariMessage"
      class="diari-message"
      role="status"
      aria-live="polite"
      hidden
    ></div>

  </main>


  <!-- JAVASCRIPT -->

  <script src="../js/config.js"></script>

  <script src="../js/api.js"></script>

  <script src="../js/diari.js"></script>

</body>

</html>
