
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>PASPA GO AI Chatbot</title>
  
<link rel="stylesheet" href="../css/chatbot.css">


</head>

<body>

  <main class="chat-container">

   
<!-- NAVIGASI ATAS PASPA AI -->
<nav class="chat-topbar" aria-label="Navigasi chatbot">

 
<button
  type="button"
  class="topbar-btn"
  id="chatBackBtn"
  onclick="window.location.href='dashboard.html'"
  aria-label="Kembali ke Dashboard"
  title="Kembali">
  &#8592;
</button>


  <span class="topbar-title">PASPA Ai</span>

  <a
    href="dashboard.html"
    class="topbar-btn"
    aria-label="Halaman utama"
    title="Dashboard">
    &#8962;
  </a>

</nav>



<header class="chat-header">
  
<div class="chat-banner-wrap">

  <img
    src="../images/paspa-ai-header.png"
    class="chat-header-image"
    alt="PASPA AI"
  >

  <img
    src="../images/paspa-helmet.png"
    class="chat-helmet-overlay"
    alt=""
  >

</div>

</header>


    <section id="chatMessages"
             aria-live="polite">

      <div class="message bot">
        Salam sejahtera! Saya PASPA Ai. Ada apa-apa soalan?
      </div>

    </section>

    <div class="chat-notice">
    
    </div>

    <form class="chat-input" id="chatForm">

      <input
        id="questionInput"
        type="text"
        placeholder="Taip pertanyaan anda..."
        maxlength="2000"
        autocomplete="off"
        required
      >

      <button id="sendBtn" type="submit">
        Hantar
      </button>

    </form>

  </main>

  
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>

<!-- MARKDOWN RENDERER -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>

<!-- HTML SANITIZER -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<script src="../js/chatbot.js"></script>


</body>
</html>
