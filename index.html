<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PASPA GO</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="app-shell">

    <section class="auth-card">

      <img
        src="images/logo.png"
        alt="Logo PASPA GO"
        class="logo"
      >

      <h1>PASPA GO</h1>

      <p class="subtitle">
        Malaysia Civil Defence Special Team
      </p>

      <!-- BORANG LOGIN -->
      <form id="loginForm">

        <h2>Log Masuk</h2>

        <label for="loginEmail">
          Email Google / Email Jabatan
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="contoh@gmail.com / contoh@civildefence.gov.my"
          autocomplete="email"
          required
        >

        <button
          type="submit"
          id="loginButton"
        >
          Log Masuk
        </button>

      </form>


      <!-- BORANG PENDAFTARAN PERTAMA -->
      <form
        id="registrationForm"
        class="hidden"
      >

        <h2>Pengaktifan Akaun</h2>

        <p class="form-info">
          Akaun ini belum didaftarkan. Masukkan ID PASPA
          dan nombor kad pengenalan untuk pengesahan.
        </p>

        <label for="registrationEmail">
          Email Google
        </label>

        <input
          type="email"
          id="registrationEmail"
          readonly
        >

        <label for="idPaspa">
          ID PASPA
        </label>

        <input
          type="text"
          id="idPaspa"
          placeholder="Contoh: 456"
          inputmode="numeric"
          required
        >

        <label for="noKP">
          No. Kad Pengenalan
        </label>

        <input
          type="text"
          id="noKP"
          placeholder="Contoh: 880912092133"
          inputmode="numeric"
          maxlength="12"
          required
        >

        <button
          type="submit"
          id="registrationButton"
        >
          Aktifkan Akaun
        </button>

        <button
          type="button"
          id="backToLoginButton"
          class="secondary-button"
        >
          Kembali
        </button>

      </form>


      <!-- MESEJ SISTEM -->
      <div
        id="systemMessage"
        class="message hidden"
        role="alert"
      ></div>

    </section>

  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
