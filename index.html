<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#0b2550">

<link
  rel="icon"
  
  type="image/png"
  href="./images/logo.png"
>

<link 
  rel="apple-touch-icon" 
  href="./images/logo.png" 
>

  <title>PASPA GO</title>


  <!-- =====================================================
       CSS UTAMA
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/style.css"
  >


  <!-- =====================================================
       GOOGLE IDENTITY SERVICES
  ====================================================== -->

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>

</head>


<body>

  <main class="app-shell">


    <section class="auth-card">


      <!-- =====================================================
           LOGO PASPA GO
      ====================================================== -->

      <img
        src="images/logo.png"
        alt="Logo PASPA GO"
        class="logo"
      >





      <p class="subtitle">
        Malaysia Civil Defence Special Team
      </p>



      <!-- =====================================================
           GOOGLE LOGIN
      ====================================================== -->

      <div class="google-login-section">

        <p class="google-login-text">
          Log masuk menggunakan email jabatan atau Akaun Google anda
        </p>

        <div id="googleSignInButton"></div>

      </div>



      <!-- =====================================================
           LOGIN LAMA
           DISEMBUNYIKAN SEMENTARA
      ====================================================== -->

      <div class="legacy-login-hidden">

        <form
          id="loginForm"
          novalidate
        >

          <h2>
            Log Masuk
          </h2>


          <label for="loginEmail">
            Email Google / Email Jabatan
          </label>


          <input
            id="loginEmail"
            name="loginEmail"
            type="email"
            autocomplete="email"
            required
          >


          <button
            id="loginButton"
            type="submit"
          >
            Log Masuk
          </button>

        </form>

      </div>



      <!-- =====================================================
           PENGAKTIFAN AKAUN
           JANGAN LETAK DALAM legacy-login-hidden
      ====================================================== -->

      <form
        id="registrationForm"
        class="hidden"
        novalidate
      >

        <h2>
          Pengesahan Ahli PASPA
        </h2>


        <p class="form-info">
          Akaun Google berjaya disahkan.
          Sila sahkan keahlian PASPA anda.
        </p>


        <label for="registrationEmail">
          Akaun Google
        </label>


        <input
          id="registrationEmail"
          name="registrationEmail"
          type="email"
          readonly
        >


        <label for="idPaspa">
          ID PASPA
        </label>


        <input
          id="idPaspa"
          name="idPaspa"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Contoh: 456"
          required
        >


        <label for="noKP">
          No. Kad Pengenalan
        </label>


        <input
          id="noKP"
          name="noKP"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          maxlength="14"
          placeholder="Contoh: 880912092133"
          required
        >


        <button
          id="registrationButton"
          type="submit"
        >
          Sahkan & Aktifkan Akaun
        </button>


        <button
          id="backToLoginButton"
          type="button"
          class="secondary-button"
        >
          Kembali
        </button>

      </form>



      <!-- =====================================================
           MESEJ SISTEM
      ====================================================== -->

      <div
        id="systemMessage"
        class="message hidden"
        role="alert"
        aria-live="polite"
      ></div>


    </section>

 <img
      src="images/logo paspa go.png"
      alt="PASPA GO"
      class="login-paspago-logo-bottom"
      
    >


  </main>


  <!-- =====================================================
       JAVASCRIPT
       SUSUNAN INI PENTING
  ====================================================== -->

  <script src="js/config.js"></script>

  <script src="js/api.js"></script>

  <script src="js/login.js"></script>



</body>

</html>
